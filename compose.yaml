services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tamagotchi}
      POSTGRES_USER: ${POSTGRES_USER:-tamagotchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagotchi_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-tamagotchi}:${POSTGRES_PASSWORD:-tamagotchi_dev}@postgres:5432/${POSTGRES_DB:-tamagotchi}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-tamagotchi}:${POSTGRES_PASSWORD:-tamagotchi_dev}@postgres:5432/${POSTGRES_DB:-tamagotchi}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate"]
    restart: "no"

  seed:
    profiles: ["demo"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-tamagotchi}:${POSTGRES_PASSWORD:-tamagotchi_dev}@postgres:5432/${POSTGRES_DB:-tamagotchi}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["seed"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: