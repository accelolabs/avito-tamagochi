server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy HTTP API requests
    location /api/v1/ {
        proxy_pass http://backend:8080;

        # Стандартные заголовки для проксирования
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://backend:8080;

        # Заголовки для Upgrade-соединения
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Увеличиваем таймаут, чтобы WS-соединение не обрывалось при простое
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Serve the React frontend for all other requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}