name: Test and Build

on:
  push:
    branches: [develop, main, workflow/CI]
  pull_request:
    branches: [develop, main, workflow/CI]

permissions:
  contents: read

concurrency:
  group: test-and-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tamagotchi_test
          POSTGRES_USER: tamagotchi
          POSTGRES_PASSWORD: tamagotchi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamagotchi -d tamagotchi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tamagotchi:tamagotchi_test@localhost:5432/tamagotchi_test?sslmode=disable
      AUTH_TEST_DATABASE_URL: postgres://tamagotchi:tamagotchi_test@localhost:5432/tamagotchi_test?sslmode=disable
      GAME_TEST_DATABASE_URL: postgres://tamagotchi:tamagotchi_test@localhost:5432/tamagotchi_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Download backend dependencies
        working-directory: backend
        run: |
          go mod download
          go mod verify

      - name: Apply test database migrations
        working-directory: backend
        env:
          MIGRATIONS_DIR: ./migrations
        run: go run ./cmd/migrate

      - name: Run backend tests
        working-directory: backend
        run: go test ./... -count=1

      - name: Run backend race tests
        working-directory: backend
        run: go test -race ./... -count=1

      - name: Build backend
        working-directory: backend
        run: go build ./cmd/api ./cmd/migrate

      - name: Install golangci-lint binary
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.10.1

      - name: Run backend linter
        working-directory: backend
        run: golangci-lint run --config ../.golangci.yml ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
